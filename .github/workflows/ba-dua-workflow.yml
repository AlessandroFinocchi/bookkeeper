name: Ba-dua-workflow
on:
  push:
    branches:
      - ale_branch
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: 8.0.372
          distribution: 'temurin' # Alternative distribution options are available.
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Clone and build ba-dua repository
        run: |
          git clone https://github.com/saeg/ba-dua
          cd ba-dua
          git checkout d2401f0
          mvn clean install
          cd ..
      - name: Build and analyze bookkeeper project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn verify -P isw2-ba-dua -Dmaven.test.failure.ignore=true
      - name: Upload XML report
        uses: actions/upload-artifact@v4
        with:
          name: Badua_Report
          path: bookkeeper-server/target/badua.xml
          if-no-files-found: error

